name: Backend security checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"
  push:
    branches:
      - main
      - "security/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/terreiro?schema=public
      JWT_SECRET: ci-only-secret-do-not-use-in-production-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Build backend
        run: npm run build
